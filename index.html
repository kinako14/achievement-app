<script>
/* Home-screen auto update bootstrap: keep this near the top of <head>. */
const APP_BUILD = "2026-08-31-v48";
(async function ensureFreshApp(){
  try{
    // Remove any Service Worker/cache left by older deployments.
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }

    if (!/^https?:$/.test(location.protocol)) return;
    const checkUrl = new URL(location.href);
    checkUrl.searchParams.set('__app_update_check', Date.now().toString());
    const response = await fetch(checkUrl.toString(), {
      cache: 'no-store',
      credentials: 'same-origin',
      headers: {'Cache-Control':'no-cache'}
    });
    if (!response.ok) return;
    const latestHtml = await response.text();
    const match = latestHtml.match(/const\s+APP_BUILD\s*=\s*["']([^"']+)["']/);
    const latestBuild = match && match[1];
    if (latestBuild && latestBuild !== APP_BUILD) {
      const reloadUrl = new URL(location.href);
      reloadUrl.searchParams.set('__app_version', latestBuild);
      reloadUrl.searchParams.set('__fresh', Date.now().toString());
      location.replace(reloadUrl.toString());
    }
  } catch (e) {
    // Offline or temporary network failure: keep the currently installed app usable.
    console.debug('update check skipped', e);
  }
})();
</script>

function save(){
  const snapshot=JSON.parse(JSON.stringify(db));
  const localRevision=revision;
  saveQueue=saveQueue.then(async()=>{
    if(!sessionToken)return false;
    saveInProgress=true;
    try{
      // 複数端末対策：保存直前に必ず最新revisionを確認する。
      // 別端末が先に保存していた場合は、古い画面の内容で上書きせず最新状態を読み込む。
      const latest=await apiCall({action:"load",token:sessionToken});
      const latestRevision=Number(latest.revision)||0;
      if(latestRevision!==localRevision){
        applyServerState(latest.data,latest.revision);
        syncIdentityFromIds();
        alert("別の端末で先に変更が保存されました。上書きを防ぐため最新データを読み込みました。内容を確認して、もう一度操作してください。");
        if(user)rerenderCurrentViewPreservingInputs();
        return false;
      }
      const r=await apiCall({action:"save",token:sessionToken,data:snapshot,revision:localRevision});
      applyServerState(r.data,r.revision);
      syncIdentityFromIds();
      return true;
    }catch(e){
      if(e.code==="conflict"&&e.body?.data){
        applyServerState(e.body.data,e.body.revision);
        syncIdentityFromIds();
        alert("別の端末で同時に更新がありました。上書きを防ぐため最新データを読み込みました。もう一度操作してください。");
        if(user)rerenderCurrentViewPreservingInputs();
      }else if(e.message!=="ログインし直してください"){
        console.error(e);alert("共通データベースへの保存に失敗しました。通信状態を確認してください。");
      }
      return false;
    }finally{
      saveInProgress=false;
    }
  });
  return saveQueue;
}

function crossingDate(m,key,threshold,pointFn=null){let total=0;for(const e of memberEntriesSorted(m)){total+=pointFn?pointFn(e):(Number(e[key])||0);if(total>=threshold)return e.date||''}return ''}

 const es=memberEntriesSorted(m);
 if(b.kind==='cumulative')return crossingDate(m,b.key,b.threshold);

 if(b.kind==='sales'){const e=es.find(x=>x.mode==='monthly'&&((Number(x.techSales)||0)+(Number(x.retailSales)||0))>=b.threshold);return e?.date||''}
 if(b.kind==='nominationPoints'){const r=db.rules.assistant||{};return crossingDate(m,'',b.threshold,e=>(Number(e.n20)||0)*(Number(r.n20)||20)+(Number(e.n40)||0)*(Number(r.n40)||40)+(Number(e.n80)||0)*(Number(r.n80)||60));}

 return '';

function rankingTabsForRole(role,mode=rankMode){return mode==='monthly'?monthlyRankingTabsForRole(role):dailyRankingTabsForRole(role)}
function rankUnit(role,key,mode=rankMode){
  if(['plus','unitPrice','techSales','retailSales'].includes(key))return '円';
  if(['lesson','preStaffLesson','supervision','lessonRecordDaily','lessonMonth'].includes(key))return 'h';
  if(['__nextRatio','__retailRatio','minimoRepeat'].includes(key))return '%';
  if(key==='assistantNominationPoints')return 'pt';
  if(['referral','referralMonth'].includes(key))return '枚';
  if(['newGuests','selfAttractMonth','selfAttractDaily','assistantGuest','nextBenefitVisitors'].includes(key))return '人';
  return '';
}
function formatRankValue(role,key,v,mode=rankMode){
  const unit=rankUnit(role,key,mode);
  if(unit==='円')return `¥${Math.round(v).toLocaleString()}`;
  if(['assistantAttendance1','assistantAttendance6','jrAttendance','attendance','eyelashBenefit','nailBenefit','holidayBenefit'].includes(key))return Number(v)>0?'達成':'未達成';
  const n=Number.isInteger(v)?v.toLocaleString():v.toLocaleString(undefined,{maximumFractionDigits:1});
  return `${n}${unit}`;
}
function topRanks(role,key,month=currentMonth(),mode=rankMode){

function showRanking(){

${formatRankValue(rankRole,rankKey,r.v,rankMode)}</div></div>`}).join(''):`<div class="rank-empty">この役職のメンバーはまだいません。</div>`}</div>${rankingPhotosHTML(rankingPhotoMonth)}`;
  requestAnimationFrame(()=>{
    const newTabs=document.getElementById('rankMetricTabs');
    if(newTabs)newTabs.scrollLeft=prevTabsLeft;
    window.scrollTo({top:prevPageY,left:0,behavior:'auto'});

  });

}

  db.customPoints[role]=JSON.parse(JSON.stringify(customRuleDraft||[]));
  ruleEditRole=null;ruleDraft=null;customRuleEditRole=null;customRuleDraft=null;
  await save();
  alert(`${roleJP(role)}のポイントルールを保存しました。子機にも自動反映されます。`);showMyPage();
}
function updateRuleDraft(role,key,value){if(ruleDraft&&ruleEditRole===role)ruleDraft[role][key]=Number(value)} function updateRuleNote(role,key,value){db.ruleNotes[role][key]=value;save()}
function deleteBuiltInRule(role,key){
 if(ruleEditRole!==role)return;
 const label=ruleLabels[role]?.[key]||key;
 if(!confirm(`「${label}」をポイントルールから削除しますか？\n\n※過去に保存済みの履歴・獲得ポイントは消えません。\n※削除後はこのルールでは新しくポイントが付与されません。`))return;
 if(!db.deletedRules[role].includes(key))db.deletedRules[role].push(key);
 if(ruleDraft?.[role])ruleDraft[role][key]=0;
 db.rules[role][key]=0;
 save();showMyPage();
}
function updateCustomRuleDraft(id,key,value){if(!customRuleDraft)return;const x=customRuleDraft.find(v=>v.id===id);if(!x)return;if(key==='points'||key==='threshold')x[key]=Number(value);else if(key==='tiersText')x.tiers=parseRatioTiers(value);else x[key]=value}
function parseRatioTiers(text){return String(text||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean).map(line=>{let m=line.match(/([0-9.]+)\s*(?:%?以上)?\s*[=:：→-]\s*([0-9.]+)/);return m?[Number(m[1]),Number(m[2])]:null}).filter(Boolean)}
function addCustomPoint(role){const name=document.getElementById(`cpName_${role}`)?.value.trim(),note=document.getElementById(`cpNote_${role}`)?.value.trim(),mode=document.getElementById(`cpMode_${role}`)?.value||'daily',calc=document.getElementById(`cpCalc_${role}`)?.value||'multiply';if(!name)return alert('項目名を入力してください');let obj={id:Date.now()+Math.floor(Math.random()*1000),name,note,mode,calc};if(calc==='ratio'){obj.numeratorLabel=document.getElementById(`cpNumLabel_${role}`)?.value.trim()||'分子';obj.denominatorLabel=document.getElementById(`cpDenLabel_${role}`)?.value.trim()||'分母';obj.tiers=parseRatioTiers(document.getElementById(`cpTiers_${role}`)?.value);if(!obj.tiers.length)return alert('比率のポイント条件を入力してください（例：60=60）')}else{obj.points=Number(document.getElementById(`cpPoints_${role}`)?.value||0);obj.threshold=Number(document.getElementById(`cpThreshold_${role}`)?.value||0)}db.customPoints[role].push(obj);save();alert(`${roleJP(role)}に「${name}」を追加しました`);showMyPage()}
function deleteCustomPoint(role,id){
 const editing=ruleEditRole===role;
 const source=editing?(customRuleDraft||[]):(db.customPoints[role]||[]);
 const x=source.find(x=>x.id===id);if(!x)return;
 if(!confirm(`「${x.name}」を削除しますか？\n※過去に保存済みのポイント履歴は消えません。`))return;
 if(editing){customRuleDraft=source.filter(x=>x.id!==id)}else{db.customPoints[role]=source.filter(x=>x.id!==id);save()}
 showMyPage();
}
function customPointAdmin(role){return `<div style="margin-top:14px;padding-top:12px;border-top:1px solid #eee5dc"><button class="secondary" style="width:100%" onclick="document.getElementById('cpAdd_${role}').classList.toggle('hidden')">＋ 新しいポイント項目を追加</button><div id="cpAdd_${role}" class="hidden" style="margin-top:12px"><div class="label">基本設定｜表示する場所</div><select id="cpMode_${role}"><option value="daily">日々入力</option><option value="monthly">月末入力</option></select><div class="label">項目名</div><input id="cpName_${role}" placeholder="例：新規次回予約の比率"><div class="label">説明文</div><textarea id="cpNote_${role}" placeholder="スタッフ画面に表示する説明"></textarea><div class="label">入力方法・計算設定</div><select id="cpCalc_${role}" onchange="document.getElementById('cpNormal_${role}').style.display=this.value==='ratio'?'none':'block';document.getElementById('cpRatio_${role}').style.display=this.value==='ratio'?'block':'none';document.getElementById('cpThresholdWrap_${role}').style.display=this.value==='fixed'?'block':'none'"><option value="multiply">数値入力｜入力数 × ポイント</option><option value="fixed">達成条件｜条件以上で固定ポイント</option><option value="ratio">比率計算｜分子 ÷ 分母 ×100</option></select><div id="cpNormal_${role}"><div id="cpThresholdWrap_${role}" style="display:none"><div class="label">条件となる数値</div><input id="cpThreshold_${role}" type="number" min="0"></div><div class="label">ポイント</div><input id="cpPoints_${role}" type="number" min="0"></div><div id="cpRatio_${role}" style="display:none"><div class="label">分子の入力名</div><input id="cpNumLabel_${role}" placeholder="例：新規次回予約数"><div class="label">分母の入力名</div><input id="cpDenLabel_${role}" placeholder="例：新規客数"><div class="label">ポイント条件</div><textarea id="cpTiers_${role}" placeholder="1行ずつ入力\n60=60\n70=100\n80=300\n90=500\n100=1000"></textarea><div class="notice" style="margin-top:6px">「60=60」は60%以上で60ptの意味です。条件はいくつでも追加できます。</div></div><button style="width:100%;margin-top:10px" onclick="addCustomPoint('${role}')">この項目を追加</button></div></div>`}
function ruleEditor(){
 return roles.map(role=>{
   const editing=ruleEditRole===role;
   const src=editing?ruleDraft[role]:db.rules[role];
   const customSrc=editing?(customRuleDraft||[]):(db.customPoints?.[role]||[]);
   const deleted=db.deletedRules?.[role]||[];
   const visibleEntries=Object.entries(src).filter(([k])=>ruleLabels[role]?.[k]&&!deleted.includes(k));
   const hasAny=visibleEntries.length>0||customSrc.length>0;
   return `<div class="field"><strong>${roleJP(role)}</strong><div class="note">${role==='royal'&&!hasAny?'現在はポイント項目なし。下の「＋ 新しいポイント項目を追加」から後で作成できます。':(editing?'この役職だけ編集中です。固定項目も追加した項目も、ここで変更・削除できます。保存するまで変更は反映されません。':'現在のポイントルール一覧です。新しく追加した項目もここに表示されます。')}</div>
   ${visibleEntries.map(([k,v])=>`<div style="padding:10px 0;border-bottom:1px solid #eee5dc"><div class="setting-row" style="border:0;padding:0"><span style="font-size:11px;max-width:${editing?'52':'68'}%">${ruleLabels[role][k]}</span>${editing?`<div style="display:flex;gap:5px;align-items:center"><input style="width:92px;padding:8px" type="number" value="${v}" oninput="updateRuleDraft('${role}','${k}',this.value);showMyPage()"><button class="ghost small" onclick="deleteBuiltInRule('${role}','${k}')">削除</button></div>`:`<b>${Number(v).toLocaleString()} pt</b>`}</div>${editing?`<textarea style="margin-top:6px" placeholder="説明文" oninput="updateRuleNote('${role}','${k}',this.value)">${esc(db.ruleNotes?.[role]?.[k]||ruleActualNote(role,k))}</textarea>`:`<div class="head-sub" style="margin-top:4px">${esc(db.ruleNotes?.[role]?.[k]||ruleActualNote(role,k))}</div>`}</div>`).join('')}
   ${customSrc.map(x=>`<div style="padding:10px 0;border-bottom:1px solid #eee5dc"><div class="setting-row" style="border:0;padding:0"><div style="font-size:11px;max-width:${editing?'50':'68'}%"><b>${esc(x.name)}</b><div class="head-sub">${x.mode==='daily'?'日々入力':'月末入力'}｜${esc(customPointRuleText(x))}</div><div class="head-sub">${esc(x.note||'説明なし')}</div></div>${editing?`<button class="ghost small" onclick="deleteCustomPoint('${role}',${x.id})">削除</button>`:`<b>${x.calc==='ratio'?'比率':x.calc==='fixed'?Number(x.points).toLocaleString()+' pt':Number(x.points).toLocaleString()+' pt/1'}</b>`}</div>${editing?`<textarea style="margin-top:6px" placeholder="説明文" oninput="updateCustomRuleDraft(${x.id},'note',this.value)">${esc(x.note||'')}</textarea>${x.calc==='ratio'?`<div class="label">比率ポイント条件</div><textarea oninput="updateCustomRuleDraft(${x.id},'tiersText',this.value)">${(x.tiers||[]).map(t=>`${t[0]}=${t[1]}`).join('\n')}</textarea>`:`<div style="display:flex;gap:6px;margin-top:6px"><input type="number" min="0" value="${x.points||0}" oninput="updateCustomRuleDraft(${x.id},'points',this.value)" placeholder="ポイント">${x.calc==='fixed'?`<input type="number" min="0" value="${x.threshold||0}" oninput="updateCustomRuleDraft(${x.id},'threshold',this.value)" placeholder="条件">`:''}</div>`}`:''}</div>`).join('')}
   ${hasAny?`<div style="display:flex;gap:8px;margin-top:12px">${editing?`<button class="secondary" style="flex:1" onclick="cancelRuleEdit()">変更をやめる</button><button style="flex:1" onclick="saveRuleEdit('${role}')">この役職の変更を保存</button>`:`<button style="width:100%" onclick="openRuleEdit('${role}')">${roleJP(role)}のポイントルールを変更</button>`}</div>`:''}
   ${customPointAdmin(role)}</div>`
 }).join('')
}
function openAdminAccordion(id){const el=document.getElementById(id);if(!el)return;el.open=true;setTimeout(()=>el.scrollIntoView({behavior:'smooth',block:'start'}),20)}
function showMyPage(){setActive('navMy');syncIdentityFromIds();let m=me(),admin='';if(isParent()){const activeMembers=orderedMembers(db.members.filter(x=>x.active!==false&&x.deleted!==true));const allMembers=orderedMembers(db.members.filter(x=>x.deleted!==true));const photoMonth=(window.adminPhotoMonthValue||currentMonth()),photos=monthPhotoList(photoMonth);const grantMonth=(window.adminGrantMonthValue||previousMonthKey());window.adminGrantMonthValue=grantMonth;admin=`<div class="notice" style="margin-bottom:10px">管理項目は、見たいところをタップすると開きます。もう一度タップすると閉じます。</div><details class="card admin-accordion" id="adminMonthly"><summary>ポイント付与管理<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice" style="margin-bottom:10px">別アプリでその月のポイント付与が完了したら、対象月を選んで「付与済みにする」を押してください。付与済みにしても履歴・入力データ・月ごとの総獲得ポイント・ランキングは残ります。</div><div class="label">付与状況を確認する月</div><div style="display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center;margin-bottom:8px"><button class="secondary small" onclick="adminGrantMonthValue=shiftMonth(window.adminGrantMonthValue||previousMonthKey(),-1);showMyPage();setTimeout(()=>openAdminAccordion('adminMonthly'),30)">← 前へ</button><div style="text-align:center;font-weight:800">${esc(monthLabel(grantMonth))}</div><button class="secondary small" onclick="adminGrantMonthValue=shiftMonth(window.adminGrantMonthValue||previousMonthKey(),1);showMyPage();setTimeout(()=>openAdminAccordion('adminMonthly'),30)">次へ →</button></div><input id="adminGrantMonth" type="month" value="${grantMonth}" onchange="adminGrantMonthValue=this.value;showMyPage();setTimeout(()=>openAdminAccordion('adminMonthly'),30)" style="margin-bottom:10px">${activeMembers.map(x=>{const earned=Math.round(monthlyPointsFor(x.name,grantMonth)),ungranted=Math.round(ungrantedPointsForMonth(x.name,grantMonth)),done=earned>0&&ungranted<=0;return `<div class="setting-row"><div style="display:flex;align-items:center;gap:9px">${avatarHTML(x,36)}<div><b>${esc(x.name)}</b><div class="head-sub">${roleJP(x.job)}｜未付与総額 ${Math.round(totalPoints(x.name)).toLocaleString()}pt</div></div></div><div style="text-align:right"><b>${esc(monthLabel(grantMonth))} ${earned.toLocaleString()}pt</b><div class="head-sub" style="margin-top:2px">${done?'付与済み':`この月の未付与 ${ungranted.toLocaleString()}pt`}</div><button class="secondary small" style="display:block;margin-top:6px;margin-left:auto" onclick="markPointsGranted('${x.id}','${grantMonth}')" ${earned<=0||ungranted<=0?'disabled':''}>${done?'付与済み':'付与済みにする'}</button></div></div>`}).join('')}</div></details><details class="card admin-accordion" id="adminMonthlyPhotos"><summary>月末写真<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">月末に掲載したい写真を親機から貼れます。保存した写真は全員のランキングページに表示されます。</div><div class="label">対象月</div><div style="display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center"><button class="secondary small" onclick="adminPhotoMonthValue=shiftMonth(document.getElementById('adminPhotoMonth').value,-1);showMyPage();setTimeout(()=>openAdminAccordion('adminMonthlyPhotos'),30)">← 前へ</button><div style="text-align:center;font-weight:800">${esc(monthLabel(photoMonth))}</div><button class="secondary small" onclick="adminPhotoMonthValue=shiftMonth(document.getElementById('adminPhotoMonth').value,1);showMyPage();setTimeout(()=>openAdminAccordion('adminMonthlyPhotos'),30)">次へ →</button></div><input id="adminPhotoMonth" type="month" value="${photoMonth}" onchange="adminPhotoMonthValue=this.value;showMonthlyPhotoMonth(this.value)" style="margin-top:8px"><div class="label">写真を追加</div><input type="file" accept="image/*" onchange="addMonthlyPhoto(this)"><div id="monthlyPhotoArea">${photos.length?`<div class="month-photo-grid">${photos.map(p=>`<div class="month-photo"><img src="${p.image}" alt="月末写真"><div class="meta">${esc(p.month)}｜${esc(p.uploadedBy||'親機')}<button class="ghost small" style="width:100%;margin-top:6px;border-color:#d8b8b3;color:#9a4f48" onclick="deleteMonthlyPhoto(${p.id})">写真を削除</button></div></div>`).join('')}</div>`:'<div class="head-sub" style="margin-top:10px">この月の写真はまだありません。</div>'}</div></div></details><details class="card admin-accordion" id="adminMembers"><summary>スタッフ一覧・管理<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">固定ユーザーIDで管理します。名前を変更しても同じ本人として履歴・ランキング・ログイン情報を引き継ぎます。追加したメンバーはログイン画面に自動反映されます。</div><div class="label">表示名</div><input id="newMemberName" placeholder="例：佐藤"><div class="label">初期PIN</div><input id="newMemberPin" inputmode="numeric" maxlength="4" placeholder="0000"><div class="label">役職</div><select id="newMemberRole"><option value="assistant">アシスタント</option><option value="jr">Jr.スタイリスト</option><option value="stylist">スタイリスト</option><option value="premium">プレミアムスタイリスト</option><option value="royal">ロイヤルスタイリスト</option></select><button style="width:100%;margin-top:10px" onclick="addMember()">スタッフを追加</button>${allMembers.map(x=>`<div class="field" style="margin-top:10px"><div class="setting-row"><div style="display:flex;align-items:center;gap:9px">${avatarHTML(x,38)}<div><b>${esc(x.name)}</b><div class="head-sub">ID: ${esc(String(x.id||''))}<br>${x.device==='parent'?'親機':'子機'}｜${x.active===false?'ログイン停止中':'利用中'}</div></div></div><button class="secondary small" onclick="requestDeviceChange('${x.name}')">権限変更</button></div><select onchange="changeJob('${x.name}',this.value)"><option value="assistant" ${x.job==='assistant'?'selected':''}>アシスタント</option><option value="jr" ${x.job==='jr'?'selected':''}>Jr.スタイリスト</option><option value="stylist" ${x.job==='stylist'?'selected':''}>スタイリスト</option><option value="premium" ${x.job==='premium'?'selected':''}>プレミアムスタイリスト</option><option value="royal" ${x.job==='royal'?'selected':''}>ロイヤルスタイリスト</option></select><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="secondary small" onclick="renameMember('${x.id}')">名前変更</button><button class="secondary small" onclick="resetPin('${x.name}')">PIN初期化</button><button class="ghost small" onclick="toggleActive('${x.name}')">${x.active===false?'ログイン再開':'ログイン停止'}</button>${x.id!==userId?`<button class="ghost small" onclick="deleteMember('${x.id}')">メンバー削除</button>`:''}</div></div>`).join('')}</div></details><details class="card admin-accordion" id="adminHistoryList"><summary>全員のポイント履歴<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">確認したいスタッフを選ぶと、申請内容を項目ごとに確認・削除できます。</div>${activeMembers.map(x=>`<button class="secondary" style="width:100%;margin-top:6px" onclick="openAdminHistory('${x.id}')">${esc(x.name)}の履歴を見る</button>`).join('')}</div></details><details class="card admin-accordion" id="adminRules"><summary>ポイントルール設定<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">役職ごとに変更できます。保存済みの過去データは再計算されません。</div>${ruleEditor()}</div></details>${manualBadgeAdminHTML()}`}page.innerHTML=`<div class="card"><div class="section-title">マイページ</div><div style="display:flex;align-items:center;gap:12px">${avatarWithBadgesHTML(m,64)}<div><b style="font-size:21px">${esc(m.name)}</b><div class="head-sub">${roleJP(m.job)}｜${m.device==='parent'?'親機（管理者）':'子機'}</div></div></div><button class="secondary" style="width:100%;margin-top:12px" onclick="renameMyName()">表示名を変更</button><div class="label">自分のアイコン</div><input type="file" accept="image/*" onchange="setMyIcon(this)">${m.icon?'<button class="ghost small" style="margin-top:6px" onclick="clearMyIcon()">アイコンを削除</button>':''}<div class="label">現在のPIN</div><input id="oldPin" type="password" inputmode="numeric" maxlength="4"><div class="label">新しい4桁PIN</div><input id="newPin" type="password" inputmode="numeric" maxlength="4"><button class="secondary" style="width:100%;margin-top:8px" onclick="changeMyPin()">パスワードを変更</button><button class="ghost" style="width:100%;margin-top:8px" onclick="logout()">ログアウト</button></div>${badgeCollectionHTML(m)}${badgeHistoryHTML(m)}${myMonthlyPointsHistoryHTML(m.name)}${admin}`}
function showMonthlyPhotoMonth(month){window.adminPhotoMonthValue=month;const area=document.getElementById('monthlyPhotoArea');if(!area)return;const photos=monthPhotoList(month);area.innerHTML=photos.length?`<div class="month-photo-grid">${photos.map(p=>`<div class="month-photo"><img src="${p.image}" alt="月末写真"><div class="meta">${esc(p.month)}｜${esc(p.uploadedBy||'親機')}<button class="ghost small" style="width:100%;margin-top:6px;border-color:#d8b8b3;color:#9a4f48" onclick="deleteMonthlyPhoto(${p.id})">写真を削除</button></div></div>`).join('')}</div>`:'<div class="head-sub" style="margin-top:10px">この月の写真はまだありません。</div>'}
</script>
