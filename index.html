<meta name="application-name" content="アチーブメント管理">
<meta name="theme-color" content="#f7f4ef">

<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Home-screen auto update bootstrap v123: re-check on launch/resume as well as first load. */
const APP_BUILD = "2026-09-23-v123-fast-login-8";
let __freshCheckRunning = false;
async function ensureFreshApp(){
  if (__freshCheckRunning) return;
  __freshCheckRunning = true;
  try{
    // Remove old Service Workers / Cache Storage so an installed PWA cannot keep stale assets.
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if (!/^https?:$/.test(location.protocol)) return;

    // Always ask the server for the launch URL again with a cache-busting query.
    // This also runs when the home-screen app returns from the background.
    const checkUrl = new URL(location.href);
    checkUrl.searchParams.delete('__app_version');
    checkUrl.searchParams.delete('__fresh');
    checkUrl.searchParams.set('__app_update_check', Date.now().toString());
    const response = await fetch(checkUrl.toString(), {
      cache: 'no-store',
      credentials: 'same-origin',
      headers: {'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}
    });
    if (!response.ok) return;
    const latestHtml = await response.text();
    const match = latestHtml.match(/const\s+APP_BUILD\s*=\s*["']([^"']+)["']/);
    const latestBuild = match && match[1];
    if (latestBuild && latestBuild !== APP_BUILD) {
      // 入力中・保存中は最新版への強制再読み込みをしない。
      // iPhoneでキーボードが閉じたり、入力途中の値が消えるのを防ぐ。
      const active = document.activeElement;
      const editing = !!(active && active.matches && active.matches('input:not([readonly]):not([disabled]), textarea:not([readonly]):not([disabled]), select:not([disabled]), [contenteditable="true"]'));
      const appBusy = (typeof saveInProgress !== 'undefined' && saveInProgress) ||
                      (typeof isFormEditing === 'function' && isFormEditing());
      if (editing || appBusy) {
        window.__pendingAppUpdate = true;
        return;
      }
      const reloadUrl = new URL(location.href);
      reloadUrl.searchParams.set('__app_version', latestBuild);
      reloadUrl.searchParams.set('__fresh', Date.now().toString());
      location.replace(reloadUrl.toString());
    }
  } catch (e) {
    console.debug('update check skipped', e);
  } finally {
    __freshCheckRunning = false;
  }
}
ensureFreshApp();
window.addEventListener('pageshow', ()=>ensureFreshApp());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') ensureFreshApp(); });
window.addEventListener('focus', ()=>ensureFreshApp());
</script>

<title>アチーブメント管理</title>
<style>
:root{
  --bg:#f7f4ef;
  --paper:#fffdfa;
  --ink:#2f2925;
  --muted:#8a817a;
  --line:#e7dfd7;
  --accent:#b99f84;
  --accent2:#dbcbb9;
  --soft:#f2ece6;
  --dark:#332d29;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}
.app{max-width:560px;margin:auto;min-height:100vh;background:linear-gradient(#fcfaf7,#fff)}
header{
  position:sticky;top:0;z-index:20;padding:15px 18px 13px;
  background:rgba(255,253,250,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.brand{font-family:Georgia,serif;letter-spacing:.4px;font-size:20px}
.brand span{color:var(--accent)}
.head-sub{font-size:11px;color:var(--muted);margin-top:3px}
main{padding:16px 15px 98px}
.hidden{display:none!important}
.card{
  background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;
  padding:16px;margin-bottom:12px;box-shadow:0 7px 22px rgba(62,49,38,.045)
}
.hero{
  background:linear-gradient(135deg,#fff 0%,#fbf6f0 60%,#f2e8de 100%);
  padding:20px;border-radius:24px;border:1px solid var(--line);margin-bottom:13px
}
.hero .eyebrow{font-size:11px;color:var(--muted);letter-spacing:.08em}
.hero .name{font-family:Georgia,"Yu Mincho",serif;font-size:28px;margin:4px 0 3px}
.hero .role{font-size:12px;color:#756c64}
.hero-total{margin-top:18px;display:flex;align-items:end;justify-content:space-between;gap:10px}
.hero-total .num{font-family:Georgia,serif;font-size:44px;line-height:1}
.hero-total .unit{font-size:13px;margin-left:4px}
.hero-total .month{font-size:11px;color:var(--muted);text-align:right;line-height:1.6}
.section-title{font-size:16px;font-weight:800;margin-bottom:12px}
.point-tier-list>summary::-webkit-details-marker{display:none}.point-tier-list>summary::marker{content:""}
.label{font-size:12px;color:var(--muted);margin:9px 0 6px}
input,select,button,textarea{font:inherit;border-radius:13px}
input,select,textarea{
  width:100%;padding:13px;border:1px solid #ddd4cc;background:#fff;color:var(--ink);font-size:16px
}
button{border:0;padding:12px 14px;background:var(--dark);color:#fff;font-weight:700}
button.secondary{background:#eee7df;color:var(--ink)}
button.ghost{background:white;color:var(--ink);border:1px solid var(--line)}
button.small{width:auto;padding:8px 10px;font-size:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.metric{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;
  min-height:112px
}
.metric .icon{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--soft);color:#7f6b58;font-size:16px;margin-bottom:9px
}
.metric .title{font-size:11px;color:var(--muted)}
.metric .value{font-family:Georgia,serif;font-size:23px;margin-top:2px}
.metric .meta{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.45}
.progress{height:6px;background:#eee8e2;border-radius:999px;overflow:hidden;margin-top:8px}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#cdb69d);border-radius:999px}
.tabs{display:flex;gap:7px;margin-bottom:12px;overflow:auto}
.tabs button{white-space:nowrap;background:#eee7df;color:#584f48;padding:9px 11px;font-size:11px}
.tabs button.active{background:var(--dark);color:#fff}
.field{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px
}
.field-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.field strong{font-size:15px}
.note{font-size:11px;color:var(--muted);line-height:1.55;margin:4px 0 10px}
.current-mini{font-size:11px;color:#6f655d;text-align:right}
.goal-row{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted);margin-top:7px}
.preview{
  background:linear-gradient(135deg,#3a332e,#57493e);color:#fff;border-radius:20px;
  padding:17px;margin:14px 0
}
.preview .smalltxt{font-size:11px;opacity:.75}
.preview .big{font-family:Georgia,serif;font-size:34px;margin-top:4px}
.preview .desc{font-size:11px;opacity:.8;margin-top:4px;line-height:1.5}
.member{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.member.locked{color:#aaa;background:#faf8f5}
.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eee7df}
.badge.parent{background:var(--dark);color:#fff}
.rank{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eee7df;font-weight:800}
.rank-name{flex:1;display:flex;align-items:center;gap:9px}.rank-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--soft);flex:0 0 34px}.rank-avatar-empty{display:grid;place-items:center;color:var(--muted);font-size:14px}.rank-val{font-weight:800}
.history-month{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden;background:#fff}
.history-month>summary,.history-day>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.history-month>summary::-webkit-details-marker,.history-day>summary::-webkit-details-marker{display:none}
.history-month>summary{padding:13px 14px;background:#f7f2ed}
.history-day{border-top:1px solid var(--line)}
.history-day>summary{padding:11px 13px;font-size:13px}
.history-fold-arrow{font-size:17px;color:var(--muted);transition:transform .18s}
details[open]>.history-fold-summary .history-fold-arrow{transform:rotate(180deg)}
.history-day-body{padding:0 13px 10px}
.history-day-body .history{padding:11px 0}


.history{padding:11px 0;border-bottom:1px solid var(--line)}
.history:last-child{border:0}
.history-date{font-size:10px;color:var(--muted)}
.history-text{font-size:13px;line-height:1.6;margin-top:4px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.notice{font-size:12px;line-height:1.65;background:#f1ebe5;padding:12px;border-radius:13px;color:#665c55}
.bottomnav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(560px,100%);
  display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))
}
.bottomnav button{background:#fff;color:#aaa097;padding:7px 2px;font-size:10px;border-radius:12px;transition:background .14s ease,color .14s ease,transform .08s ease}
.bottomnav button b{display:block;font-size:18px;margin-bottom:3px}
.bottomnav button:active{transform:scale(.97)}
.bottomnav button.active{color:#6b5443;background:#f1e8df;font-weight:800}
.bottomnav button.active b{color:#9a8068}
.rank-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rank-role-select{width:auto;max-width:190px;padding:8px 30px 8px 10px;font-size:11px;font-weight:700;border-radius:12px;background:#fffdfb}
.rank-empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:12px}
.rank-live{font-size:10px;color:var(--muted);margin:-4px 0 10px}

.login-name-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}
.login-name-btn{min-height:54px;text-align:left;padding:10px 12px;border:1px solid var(--line);background:#fff;border-radius:14px;color:#514943;display:flex;align-items:center;gap:9px}

const ENTRY_DRAFT_PREFIX='francesca_entry_draft_v1';
function createEntrySubmissionId(){

  return `entry-${Date.now()}-${Math.random().toString(36).slice(2)}-${Math.random().toString(36).slice(2)}`;
}
function entryDraftKey(memberId,date,mode){
  return `${ENTRY_DRAFT_PREFIX}:${memberId||''}:${date||''}:${mode==='monthly'?'monthly':'daily'}`;
}
function currentEntryDraftKey(){
  const m=member(target);

}
function collectEntryDraftValues(){
  const values={};
  document.querySelectorAll('#inputFields input,#inputFields select,#inputFields textarea').forEach(el=>{
    if(!el.id||el.disabled||el.readOnly)return;
    if(el.type==='checkbox'||el.type==='radio')values[el.id]=!!el.checked;
    else values[el.id]=el.value;
  });

function hasMeaningfulDraftValues(values){

    if(typeof v==='boolean')return v;
    return String(v??'').trim()!=='' && Number(v)!==0 || (String(v??'').trim()!=='' && isNaN(Number(v)));
  });
}
function saveCurrentEntryDraft(status='unsent'){
  const key=currentEntryDraftKey();if(!key)return false;
  const values=collectEntryDraftValues();
  if(!hasMeaningfulDraftValues(values)){
    localStorage.removeItem(key);updateUnsentDraftUI(null);return false;
  }
  // 同じ下書きは、通信エラー後に何度再送しても同じ履歴IDを使う。
  // 保存の返事だけ届かなかった場合でも、サーバー側で重複追加されない。
  let previous=null;try{const raw=localStorage.getItem(key);if(raw)previous=JSON.parse(raw)}catch(e){}

  try{localStorage.setItem(key,JSON.stringify(draft));updateUnsentDraftUI(draft);return true}catch(e){console.warn('draft save failed',e);return false}
}
function loadCurrentEntryDraft(){
  const key=currentEntryDraftKey();if(!key)return null;
  try{const raw=localStorage.getItem(key);if(!raw)return null;const d=JSON.parse(raw);return d&&d.values?d:null}catch(e){return null}
}
function clearCurrentEntryDraft(){
  const key=currentEntryDraftKey();if(key)localStorage.removeItem(key);updateUnsentDraftUI(null);
}
function restoreCurrentEntryDraft(){
  const d=loadCurrentEntryDraft();
  if(!d){updateUnsentDraftUI(null);return false}
  Object.entries(d.values||{}).forEach(([id,v])=>{
    const el=document.getElementById(id);if(!el||el.disabled||el.readOnly)return;
    if(el.type==='checkbox'||el.type==='radio')el.checked=!!v;else el.value=v;
  });
  updateUnsentDraftUI(d);updatePreview();return true;

function draftTimeText(iso){

}
function updateUnsentDraftUI(draft){

  const btn=document.getElementById('entrySaveBtn');

  if(banner){
    banner.classList.toggle('show',active);
    banner.classList.remove('sending','failed');
    if(active&&draft.status==='failed'){
      banner.classList.add('failed');
      banner.innerHTML=`<b>送信できませんでした</b>入力内容は消えずに端末へ残っています。通信状態を確認して、下の「この内容を送信」をもう一度押してください。<div class="draft-time">${esc(draftTimeText(draft.updatedAt))}</div>`;
    }else if(active)banner.innerHTML=`<b>入力内容を一時保存しています</b>まだ送信は完了していません。内容を確認して、下の「この内容を送信」を押してください。<div class="draft-time">${esc(draftTimeText(draft.updatedAt))}</div>`;

function savedEntryMatches(expected,actual){
  if(!actual)return false;
  const ignore=new Set(['createdAt']);
  return Object.keys(expected||{}).every(k=>{
    if(ignore.has(k))return true;
    const a=expected[k],b=actual[k];
    if(typeof a==='number')return Number(b)===Number(a);
    return String(b??'')===String(a??'');
  });
}
async function saveEntryRecordSafely(e){
  if(!sessionToken)return false;
  saveInProgress=true;
  try{
    // 最新状態へこの1件だけを追加して保存。競合時は最新データを取り直して再試行する。
    for(let attempt=0;attempt<4;attempt++){
      const latest=await apiCall({action:'load',token:sessionToken});
      const fresh=normalizeDB(latest.data);
      const existingIndex=(fresh.entries||[]).findIndex(x=>String(x.id)===String(e.id));
      if(existingIndex>=0)fresh.entries[existingIndex]=JSON.parse(JSON.stringify(e));
      else fresh.entries.push(JSON.parse(JSON.stringify(e)));
      try{
        const r=await apiCall({action:'save',token:sessionToken,data:fresh,revision:Number(latest.revision)||0});
        const returned=normalizeDB(r.data);
        const stored=(returned.entries||[]).find(x=>String(x.id)===String(e.id));
        if(!savedEntryMatches(e,stored)){
          console.warn('save response verification failed',e,stored);
          continue;
        }
        applyServerState(returned,r.revision);syncIdentityFromIds();return true;
      }catch(err){
        if(err.code==='conflict')continue;
        // 保存は完了したのに応答だけ途切れた可能性があるため、失敗表示の前に確認する。
        try{
          const confirmed=await apiCall({action:'load',token:sessionToken});
          const confirmedDB=normalizeDB(confirmed.data);
          const stored=(confirmedDB.entries||[]).find(x=>String(x.id)===String(e.id));
          if(savedEntryMatches(e,stored)){
            applyServerState(confirmedDB,confirmed.revision);syncIdentityFromIds();return true;
          }
        }catch(confirmErr){console.warn('entry save confirmation failed',confirmErr)}
        throw err;
      }
    }
    throw new Error('save_verify_retry_exceeded');
  }catch(err){
    console.error('entry save failed',err);
    if(err.message!=="ログインし直してください")alert('送信できませんでした。入力内容は画面に残しています。通信状態を確認して、もう一度「この内容を送信」を押してください。');
    return false;
  }finally{saveInProgress=false}
}

  db.entries.push(e);

function rankingTabsForRole(role,mode=rankMode){return mode==='monthly'?monthlyRankingTabsForRole(role):dailyRankingTabsForRole(role)}
function rankUnit(role,key,mode=rankMode){

  if(['lesson','preStaffLesson','supervision','lessonRecordDaily','lessonMonth'].includes(key))return 'h';
  if(['__nextRatio','__retailRatio','minimoRepeat'].includes(key))return '%';
  if(key==='assistantNominationPoints'||key==='entryPoints'||key==='newgradMonthly'||key==='newgradTotal')return 'pt';

  if(['newGuests','newGuestsDaily','selfAttractMonth','selfAttractDaily','assistantGuest','nextBenefitVisitors'].includes(key))return '人';
  if(['newNext','newNextDaily'].includes(key))return '件';

function formatRankValue(role,key,v,mode=rankMode){

function rankingRoleForMonth(m,month){

function memberEligibleForRanking(m,role,month){

const RANK_MOTION_STORE='francesca_rank_motion_v51';
function rankMotionKey(role,key,month,mode){return `${role}|${mode}|${month}|${key}`}
function rankMotionFor(rows,role,key,month,mode){
  let all={};try{all=JSON.parse(localStorage.getItem(RANK_MOTION_STORE)||'{}')||{}}catch(e){}
  const k=rankMotionKey(role,key,month,mode), names=rows.map(r=>r.name), prev=all[k];
  let previous,current;
  if(!prev){previous=names.slice();current=names.slice();}
  else if(Number(prev.revision)!==Number(observedRevision)){previous=Array.isArray(prev.current)?prev.current.slice():names.slice();current=names.slice();}
  else{previous=Array.isArray(prev.previous)?prev.previous.slice():names.slice();current=Array.isArray(prev.current)?prev.current.slice():names.slice();}
  all[k]={revision:Number(observedRevision)||0,previous,current};
  try{localStorage.setItem(RANK_MOTION_STORE,JSON.stringify(all))}catch(e){}
  return rows.map((r,i)=>{const p=previous.indexOf(r.name);if(p<0)return 'up';if(i<p)return 'up';if(i>p)return 'down';return 'same'})
}

async function saveRuleEdit(role,button){
  if(!confirm(`${roleJP(role)}のポイントルール変更を保存しますか？`))return;
  const oldText=button?.textContent||'この役職の変更を保存';
  if(button){button.disabled=true;button.textContent='保存中…'}
  document.querySelectorAll(`[data-rule-role="${role}"][data-rule-key]`).forEach(el=>{ruleDraft[role][el.dataset.ruleKey]=Number(el.value)});
  document.querySelectorAll(`[data-rule-note-role="${role}"][data-rule-note-key]`).forEach(el=>{ruleNoteDraft[role][el.dataset.ruleNoteKey]=el.value});
  document.querySelectorAll(`[data-rule-title-role="${role}"][data-rule-title-key]`).forEach(el=>{ruleTitleDraft[role][el.dataset.ruleTitleKey]=el.value.trim()});
  document.querySelectorAll(`[data-rule-threshold-role="${role}"][data-rule-threshold-key]`).forEach(el=>{ruleThresholdDraft[role][el.dataset.ruleThresholdKey]=Number(el.value)});
  if(role==='newgrad')document.querySelectorAll('[data-newgrad-deadline-key]').forEach(el=>{ruleDeadlineDraft.newgrad[el.dataset.newgradDeadlineKey]=el.value});
  if(role==='newgrad'){const c=document.getElementById('newgradCompleteDeadline');if(c?.value)ruleDeadlineDraft.newgradComplete=c.value}
  // ルールを書き換える直前に、旧履歴の各項目ポイントを旧ルールの値で固定する。
  freezeUnsnapshottedEntries();
  db.rules[role]=JSON.parse(JSON.stringify(ruleDraft[role]));
  db.ruleNotes[role]=JSON.parse(JSON.stringify(ruleNoteDraft[role]||{}));
  db.ruleTitles[role]=JSON.parse(JSON.stringify(ruleTitleDraft[role]||{}));
  db.ruleThresholds[role]=JSON.parse(JSON.stringify(ruleThresholdDraft[role]||{}));
  if(role==='newgrad')db.ruleDeadlines=JSON.parse(JSON.stringify(ruleDeadlineDraft));
  db.customPoints[role]=JSON.parse(JSON.stringify(customRuleDraft||[]));
  const saved=await save();
  if(!saved){if(button){button.disabled=false;button.textContent=oldText}return}
  ruleEditRole=null;ruleDraft=null;ruleNoteDraft=null;ruleTitleDraft=null;ruleThresholdDraft=null;ruleDeadlineDraft=null;customRuleEditRole=null;customRuleDraft=null;
  refreshRuleEditor();showRuleSavedNotice(role);
}

async function deleteBuiltInRule(role,key,button){
 if(ruleEditRole!==role)return;
 const label=ruleLabels[role]?.[key]||key;
 if(!confirm(`「${label}」をポイントルールから削除しますか？\n\n※過去に保存済みの履歴・獲得ポイントは消えません。\n※削除後はこのルールでは新しくポイントが付与されません。`))return;
 const before=JSON.parse(JSON.stringify(db)),oldText=button?.textContent||'削除';
 if(button){button.disabled=true;button.textContent='削除中…'}
 if(!db.deletedRules[role].includes(key))db.deletedRules[role].push(key);

r"><button class="secondary small" onclick="adminPhotoMonthValue=shiftMonth(document.getElementById('adminPhotoMonth').value,-1);showMyPage();setTimeout(()=>openAdminAccordion('adminMonthlyPhotos'),30)">← 前へ</button><div style="text-align:center;font-weight:800">${esc(monthLabel(photoMonth))}</div><button class="secondary small" onclick="adminPhotoMonthValue=shiftMonth(document.getElementById('adminPhotoMonth').value,1);showMyPage();setTimeout(()=>openAdminAccordion('adminMonthlyPhotos'),30)">次へ →</button></div><input id="adminPhotoMonth" type="month" value="${photoMonth}" onchange="adminPhotoMonthValue=this.value;showMonthlyPhotoMonth(this.value)" style="margin-top:8px"><div class="label">写真を追加</div><input type="file" accept="image/*" onchange="addMonthlyPhoto(this)"><div id="monthlyPhotoArea">${photos.length?`<div class="month-photo-grid">${photos.map(p=>`<div class="month-photo"><img src="${p.image}" alt="月末写真"><div class="meta">${esc(p.month)}｜${esc(p.uploadedBy||'親機')}<button class="ghost small" style="width:100%;margin-top:6px;border-color:#d8b8b3;color:#9a4f48" onclick="deleteMonthlyPhoto(${p.id},this)">写真を削除</button></div></div>`).join('')}</div>`:'<div class="head-sub" style="margin-top:10px">この月の写真はまだありません。</div>'}</div></div></details><details class="card admin-accordion" id="adminMembers"><summary>スタッフ一覧・管理<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">固定ユーザーIDで管理します。名前を変更しても同じ本人として履歴・ランキング・ログイン情報を引き継ぎます。追加したメンバーはログイン画面に自動反映されます。</div><div class="label">表示名</div><input id="newMemberName" placeholder="例：佐藤"><div class="label">初期PIN</div><input id="newMemberPin" inputmode="numeric" maxlength="4" placeholder="0000"><div class="label">役職</div><select id="newMemberRole"><option value="assistant">アシスタント</option><option value="jr">Jr.スタイリスト</option><option value="stylist">スタイリスト</option><option value="premium">プレミアムスタイリスト</option><option value="royal">ロイヤルスタイリスト</option></select><button style="width:100%;margin-top:10px" onclick="addMember()">スタッフを追加</button>${allMembers.map(x=>`<div class="field" style="margin-top:10px"><div class="setting-row"><div style="display:flex;align-items:center;gap:9px">${avatarHTML(x,38)}<div><b>${esc(x.name)}</b><div class="head-sub">ID: ${esc(String(x.id||''))}<br>${x.device==='parent'?'親機':'子機'}｜${x.active===false?'ログイン停止中':'利用中'}</div></div></div><button class="secondary small" onclick="requestDeviceChange('${x.name}')">権限変更</button></div><select onchange="changeJob('${x.name}',this.value)"><option value="assistant" ${x.job==='assistant'?'selected':''}>アシスタント</option><option value="jr" ${x.job==='jr'?'selected':''}>Jr.スタイリスト</option><option value="stylist" ${x.job==='stylist'?'selected':''}>スタイリスト</option><option value="premium" ${x.job==='premium'?'selected':''}>プレミアムスタイリスト</option><option value="royal" ${x.job==='royal'?'selected':''}>ロイヤルスタイリスト</option></select><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="secondary small" onclick="renameMember('${x.id}')">名前変更</button><button class="secondary small" onclick="resetPin('${x.name}')">PIN初期化</button><button class="ghost small" onclick="toggleActive('${x.name}')">${x.active===false?'ログイン再開':'ログイン停止'}</button>${x.id!==userId?`<button class="ghost small" onclick="deleteMember('${x.id}',this)">メンバー削除</button>`:''}</div></div>`).join('')}</div></details><details class="card admin-accordion" id="adminHistoryList"><summary>全員のポイント履歴<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">確認したいスタッフを選ぶと、申請内容を項目ごとに確認・削除できます。</div>${activeMembers.map(x=>`<button class="secondary" style="width:100%;margin-top:6px" onclick="openAdminHistory('${x.id}')">${esc(x.name)}の履歴を見る</button>`).join('')}</div></details><details class="card admin-accordion" id="adminRules"><summary>ポイントルール設定<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">役職ごとに変更できます。保存済みの過去データは再計算されません。</div><div id="ruleEditorRoot">${ruleEditor()}</div></div></details>${manualBadgeAdminHTML()}`}page.innerHTML=`<div class="card"><div class="section-title">マイページ</div><div style="display:flex;align-items:center;gap:12px">${avatarWithBadgesHTML(m,64)}<div><b style="font-size:21px">${esc(m.name)}</b><div class="head-sub">${roleJP(m.job)}｜${m.device==='parent'?'親機（管理者）':'子機'}</div></div></div><button class="secondary" style="width:100%;margin-top:12px" onclick="renameMyName()">表示名を変更</button><div class="label">自分のアイコン</div><input type="file" accept="image/*" onchange="setMyIcon(this)">${m.icon?'<button class="ghost small" style="margin-top:6px" onclick="clearMyIcon(this)">アイコンを削除</button>':''}<div class="label">現在のPIN</div><input id="oldPin" type="password" inputmode="numeric" maxlength="4"><div class="label">新しい4桁PIN</div><input id="newPin" type="password" inputmode="numeric" maxlength="4"><button class="secondary" style="width:100%;margin-top:8px" onclick="changeMyPin()">パスワードを変更</button><button class="ghost" style="width:100%;margin-top:8px" onclick="logout()">ログアウト</button></div>${badgeCollectionHTML(m)}${badgeHistoryHTML(m)}${myMonthlyPointsHistoryHTML(m.name)}${admin}`}
function showMonthlyPhotoMonth(month){window.adminPhotoMonthValue=month;const area=document.getElementById('monthlyPhotoArea');if(!area)return;const photos=monthPhotoList(month);area.innerHTML=photos.length?`<div class="month-photo-grid">${photos.map(p=>`<div class="month-photo"><img src="${p.image}" alt="月末写真"><div class="meta">${esc(p.month)}｜${esc(p.uploadedBy||'親機')}<button class="ghost small" style="width:100%;margin-top:6px;border-color:#d8b8b3;color:#9a4f48" onclick="deleteMonthlyPhoto(${p.id},this)">写真を削除</button></div></div>`).join('')}</div>`:'<div class="head-sub" style="margin-top:10px">この月の写真はまだありません。</div>'}

// v108: 追加項目の「pt/1」表示を、「1人につき○pt」または「入力1につき○pt」に変更。

const showMyPageV101=showMyPage;
showMyPage=function(){
  showMyPageV101();
  if(!isParent())return;
  const panel=document.querySelector('#adminMonthly .admin-accordion-body');if(!panel)return;
  const notice=panel.querySelector('.notice');
  if(notice)notice.textContent='その時点の未付与ポイントだけを何度でも付与できます。付与済み分を間違えた場合は、その月の「取り消す」から未付与へ戻せます。';
  const month=window.adminGrantMonthValue||previousMonthKey();
  const ms=orderedMembers(db.members.filter(x=>x.active!==false&&x.deleted!==true));
  const rows=[...panel.children].filter(el=>el.classList?.contains('setting-row'));
  rows.forEach((row,index)=>{
    const m=ms[index];if(!m)return;
    const earned=Math.round(monthlyPointsFor(m.name,month));
    const unpaid=Math.round(ungrantedPointsForMonth(m.name,month));
    const granted=Math.round(grantedPointsForMonth(m.name,month));
    const done=isMonthFullyGranted(m.name,month);
    const right=row.lastElementChild;if(!right)return;
    right.style.minWidth='145px';
    right.innerHTML=`<b>${esc(monthLabel(month))} ${earned.toLocaleString()}pt</b><div style="display:flex;justify-content:flex-end;align-items:center;gap:6px;margin-top:3px"><span class="head-sub">付与済み ${granted.toLocaleString()}pt</span>${granted>0?`<button class="ghost small" style="padding:5px 8px;border-color:#d8b8b3;color:#9a4f48" onclick="cancelAllPointGrants('${m.id}','${month}',this)">取り消す</button>`:''}</div><div class="head-sub">未付与 ${Math.max(0,unpaid).toLocaleString()}pt</div><button class="secondary small" style="display:block;margin-top:7px;margin-left:auto" onclick="markPointsGranted('${m.id}','${month}',this)" ${earned<=0||unpaid<=0?'disabled':''}>${done?'付与済み':unpaid>0?`${unpaid.toLocaleString()}ptを付与済みにする`:'付与履歴なし'}</button>`;
  });
}
