<meta name="apple-mobile-web-app-title" content="アチーブメント管理">
<meta name="application-name" content="アチーブメント管理">
<meta name="theme-color" content="#f7f4ef">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<script>
/* Home-screen auto update bootstrap v62: re-check on launch/resume as well as first load. */
const APP_BUILD = "2026-09-03-v94";
let __freshCheckRunning = false;
async function ensureFreshApp(){
  if (__freshCheckRunning) return;
  __freshCheckRunning = true;
  try{
    // Remove old Service Workers / Cache Storage so an installed PWA cannot keep stale assets.
    if ('serviceWorker' in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if ('caches' in window) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
    if (!/^https?:$/.test(location.protocol)) return;

    // Always ask the server for the launch URL again with a cache-busting query.
    // This also runs when the home-screen app returns from the background.
    const checkUrl = new URL(location.href);
    checkUrl.searchParams.delete('__app_version');
    checkUrl.searchParams.delete('__fresh');
    checkUrl.searchParams.set('__app_update_check', Date.now().toString());
    const response = await fetch(checkUrl.toString(), {
      cache: 'no-store',
      credentials: 'same-origin',
      headers: {'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}
    });
    if (!response.ok) return;
    const latestHtml = await response.text();
    const match = latestHtml.match(/const\s+APP_BUILD\s*=\s*["']([^"']+)["']/);
    const latestBuild = match && match[1];
    if (latestBuild && latestBuild !== APP_BUILD) {
      // 入力中・保存中は最新版への強制再読み込みをしない。
      // iPhoneでキーボードが閉じたり、入力途中の値が消えるのを防ぐ。
      const active = document.activeElement;
      const editing = !!(active && active.matches && active.matches('input:not([readonly]):not([disabled]), textarea:not([readonly]):not([disabled]), select:not([disabled]), [contenteditable="true"]'));
      const appBusy = (typeof saveInProgress !== 'undefined' && saveInProgress) ||
                      (typeof isFormEditing === 'function' && isFormEditing());
      if (editing || appBusy) {
        window.__pendingAppUpdate = true;
        return;
      }
      const reloadUrl = new URL(location.href);
      reloadUrl.searchParams.set('__app_version', latestBuild);
      reloadUrl.searchParams.set('__fresh', Date.now().toString());
      location.replace(reloadUrl.toString());
    }
  } catch (e) {
    console.debug('update check skipped', e);
  } finally {
    __freshCheckRunning = false;
  }
}
ensureFreshApp();
window.addEventListener('pageshow', ()=>ensureFreshApp());
document.addEventListener('visibilitychange', ()=>{ if(document.visibilityState==='visible') ensureFreshApp(); });
window.addEventListener('focus', ()=>ensureFreshApp());
</script>

<title>アチーブメント管理</title>
<style>
:root{
  --bg:#f7f4ef;
  --paper:#fffdfa;
  --ink:#2f2925;
  --muted:#8a817a;
  --line:#e7dfd7;
  --accent:#b99f84;
  --accent2:#dbcbb9;
  --soft:#f2ece6;
  --dark:#332d29;
}
*{box-sizing:border-box}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif
}
.app{max-width:560px;margin:auto;min-height:100vh;background:linear-gradient(#fcfaf7,#fff)}
header{
  position:sticky;top:0;z-index:20;padding:15px 18px 13px;
  background:rgba(255,253,250,.96);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line)
}
.brand{font-family:Georgia,serif;letter-spacing:.4px;font-size:20px}
.brand span{color:var(--accent)}
.head-sub{font-size:11px;color:var(--muted);margin-top:3px}
main{padding:16px 15px 98px}
.hidden{display:none!important}
.card{
  background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:20px;
  padding:16px;margin-bottom:12px;box-shadow:0 7px 22px rgba(62,49,38,.045)
}
.hero{
  background:linear-gradient(135deg,#fff 0%,#fbf6f0 60%,#f2e8de 100%);
  padding:20px;border-radius:24px;border:1px solid var(--line);margin-bottom:13px
}
.hero .eyebrow{font-size:11px;color:var(--muted);letter-spacing:.08em}
.hero .name{font-family:Georgia,"Yu Mincho",serif;font-size:28px;margin:4px 0 3px}
.hero .role{font-size:12px;color:#756c64}
.hero-total{margin-top:18px;display:flex;align-items:end;justify-content:space-between;gap:10px}
.hero-total .num{font-family:Georgia,serif;font-size:44px;line-height:1}
.hero-total .unit{font-size:13px;margin-left:4px}
.hero-total .month{font-size:11px;color:var(--muted);text-align:right;line-height:1.6}
.section-title{font-size:16px;font-weight:800;margin-bottom:12px}
.label{font-size:12px;color:var(--muted);margin:9px 0 6px}
input,select,button,textarea{font:inherit;border-radius:13px}
input,select,textarea{
  width:100%;padding:13px;border:1px solid #ddd4cc;background:#fff;color:var(--ink);font-size:16px
}
button{border:0;padding:12px 14px;background:var(--dark);color:#fff;font-weight:700}
button.secondary{background:#eee7df;color:var(--ink)}
button.ghost{background:white;color:var(--ink);border:1px solid var(--line)}
button.small{width:auto;padding:8px 10px;font-size:12px}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
.metric{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:13px;
  min-height:112px
}
.metric .icon{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:var(--soft);color:#7f6b58;font-size:16px;margin-bottom:9px
}
.metric .title{font-size:11px;color:var(--muted)}
.metric .value{font-family:Georgia,serif;font-size:23px;margin-top:2px}
.metric .meta{font-size:10px;color:var(--muted);margin-top:7px;line-height:1.45}
.progress{height:6px;background:#eee8e2;border-radius:999px;overflow:hidden;margin-top:8px}
.progress > span{display:block;height:100%;background:linear-gradient(90deg,var(--accent),#cdb69d);border-radius:999px}
.tabs{display:flex;gap:7px;margin-bottom:12px;overflow:auto}
.tabs button{white-space:nowrap;background:#eee7df;color:#584f48;padding:9px 11px;font-size:11px}
.tabs button.active{background:var(--dark);color:#fff}
.field{
  background:#fff;border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:10px
}
.field-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.field strong{font-size:15px}
.note{font-size:11px;color:var(--muted);line-height:1.55;margin:4px 0 10px}
.current-mini{font-size:11px;color:#6f655d;text-align:right}
.goal-row{display:flex;justify-content:space-between;gap:8px;font-size:10px;color:var(--muted);margin-top:7px}
.preview{
  background:linear-gradient(135deg,#3a332e,#57493e);color:#fff;border-radius:20px;
  padding:17px;margin:14px 0
}
.preview .smalltxt{font-size:11px;opacity:.75}
.preview .big{font-family:Georgia,serif;font-size:34px;margin-top:4px}
.preview .desc{font-size:11px;opacity:.8;margin-top:4px;line-height:1.5}
.member{display:flex;align-items:center;justify-content:space-between;padding:12px;border:1px solid var(--line);border-radius:14px;background:#fff;margin-bottom:8px}
.member.locked{color:#aaa;background:#faf8f5}
.badge{font-size:11px;padding:5px 8px;border-radius:999px;background:#eee7df}
.badge.parent{background:var(--dark);color:#fff}
.rank{display:flex;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line)}
.rank:last-child{border:0}
.rank-no{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#eee7df;font-weight:800}
.rank-name{flex:1;display:flex;align-items:center;gap:9px}.rank-avatar{width:34px;height:34px;border-radius:50%;object-fit:cover;border:1px solid var(--line);background:var(--soft);flex:0 0 34px}.rank-avatar-empty{display:grid;place-items:center;color:var(--muted);font-size:14px}.rank-val{font-weight:800}
.history-month{border:1px solid var(--line);border-radius:14px;margin-top:10px;overflow:hidden;background:#fff}
.history-month>summary,.history-day>summary{list-style:none;cursor:pointer;display:flex;align-items:center;justify-content:space-between;gap:10px;font-weight:800}
.history-month>summary::-webkit-details-marker,.history-day>summary::-webkit-details-marker{display:none}
.history-month>summary{padding:13px 14px;background:#f7f2ed}
.history-day{border-top:1px solid var(--line)}
.history-day>summary{padding:11px 13px;font-size:13px}
.history-fold-arrow{font-size:17px;color:var(--muted);transition:transform .18s}
details[open]>.history-fold-summary .history-fold-arrow{transform:rotate(180deg)}
.history-day-body{padding:0 13px 10px}
.history-day-body .history{padding:11px 0}


.history{padding:11px 0;border-bottom:1px solid var(--line)}
.history:last-child{border:0}
.history-date{font-size:10px;color:var(--muted)}
.history-text{font-size:13px;line-height:1.6;margin-top:4px}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:11px 0;border-bottom:1px solid var(--line)}
.setting-row:last-child{border-bottom:0}
.notice{font-size:12px;line-height:1.65;background:#f1ebe5;padding:12px;border-radius:13px;color:#665c55}
.bottomnav{
  position:fixed;left:50%;transform:translateX(-50%);bottom:0;z-index:30;width:min(560px,100%);
  display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-top:1px solid var(--line);
  padding:7px 4px calc(7px + env(safe-area-inset-bottom))
}
.bottomnav button{background:#fff;color:#aaa097;padding:7px 2px;font-size:10px;border-radius:12px;transition:background .14s ease,color .14s ease,transform .08s ease}
.bottomnav button b{display:block;font-size:18px;margin-bottom:3px}
.bottomnav button:active{transform:scale(.97)}
.bottomnav button.active{color:#6b5443;background:#f1e8df;font-weight:800}
.bottomnav button.active b{color:#9a8068}
.rank-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.rank-role-select{width:auto;max-width:190px;padding:8px 30px 8px 10px;font-size:11px;font-weight:700;border-radius:12px;background:#fffdfb}
.rank-empty{padding:18px 4px;text-align:center;color:var(--muted);font-size:12px}
.rank-live{font-size:10px;color:var(--muted);margin:-4px 0 10px}

.login-name-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:10px}

function deepEqual(a,b){try{return JSON.stringify(a)===JSON.stringify(b)}catch(e){return a===b}}
function mergeObjectChanges(base,local,remote){
  if(deepEqual(base,local))return JSON.parse(JSON.stringify(remote));

  const keys=new Set([...Object.keys(base||{}),...Object.keys(local||{})]);
  keys.forEach(k=>{
    if(!(k in local)){if(k in base)delete out[k];return}
    if(!(k in base)){out[k]=JSON.parse(JSON.stringify(local[k]));return}
    if(!deepEqual(base[k],local[k]))out[k]=mergeObjectChanges(base[k],local[k],remote?remote[k]:undefined);

function mergeById(baseArr,localArr,remoteArr,idKey='id'){

function mergeLocalChanges(base,local,remote){

  out.entries=mergeById(base.entries,local.entries,remote.entries,'id');
  ['rules','ruleNotes','customPoints','deletedRules'].forEach(k=>{out[k]=mergeObjectChanges(base[k]||{},local[k]||{},remote[k]||{})});

  out.monthlyPhotos=mergeById(base.monthlyPhotos||[],local.monthlyPhotos||[],remote.monthlyPhotos||[],'id');

function save(){
  const snapshot=JSON.parse(JSON.stringify(db));
  const baseSnapshot=lastServerDB?JSON.parse(JSON.stringify(lastServerDB)):null;
  const localRevision=revision;
  saveQueue=saveQueue.then(async()=>{
    if(!sessionToken)return false;
    saveInProgress=true;
    try{
      let dataToSave=snapshot,revisionToSave=localRevision;
      const latest=await apiCall({action:"load",token:sessionToken});
      const latestRevision=Number(latest.revision)||0;
      if(latestRevision!==localRevision){
        // 別端末の変更は残したまま、この端末で変更した差分だけ自動マージする。
        dataToSave=mergeLocalChanges(baseSnapshot,snapshot,normalizeDB(latest.data));
        revisionToSave=latestRevision;
      }
      try{
        const r=await apiCall({action:"save",token:sessionToken,data:dataToSave,revision:revisionToSave});
        applyServerState(r.data,r.revision);syncIdentityFromIds();return true;
      }catch(e){

          const merged=mergeLocalChanges(baseSnapshot,snapshot,normalizeDB(e.body.data));
          const retry=await apiCall({action:"save",token:sessionToken,data:merged,revision:Number(e.body.revision)||0});
          applyServerState(retry.data,retry.revision);syncIdentityFromIds();return true;
        }
        throw e;
      }
    }catch(e){
      if(e.message!=="ログインし直してください"){console.error(e);alert("保存に失敗しました。通信状態を確認して、もう一度保存してください。")}

    }finally{saveInProgress=false}
  });

}

setInterval(()=>{
  if(document.visibilityState!=="visible"||saveInProgress)return;
  if(isFormEditing()){deferredSync=true;return;}
  syncLatest(true);deferredSync=false;
},3000);

let homeViewMonth=currentMonth();
function entrySortValue(e){
  const ts=Date.parse(e?.createdAt||e?.savedAt||'');
  if(Number.isFinite(ts))return ts;
  const n=Number(e?.id);
  if(Number.isFinite(n)&&n>0)return n;
  const idx=(db.entries||[]).findIndex(x=>String(x.id)===String(e?.id));
  return idx>=0?idx:0;
}
function compareEntriesNewest(a,b){
  const d=String(b?.date||'').localeCompare(String(a?.date||''));
  return d||entrySortValue(b)-entrySortValue(a);
}
function compareEntriesOldest(a,b){
  const d=String(a?.date||'').localeCompare(String(b?.date||''));
  return d||entrySortValue(a)-entrySortValue(b);
}
function homeMonthEntriesByMode(n,mode){const mk=homeViewMonth||currentMonth();return entries(n).filter(e=>(e.date||'').startsWith(mk)&&e.mode===mode)}
function homeSumMode(n,key,mode='daily'){return homeMonthEntriesByMode(n,mode).reduce((a,e)=>a+(Number(e[key])||0),0)}
function homeLatestModeValue(n,key,mode='monthly'){
  const arr=homeMonthEntriesByMode(n,mode).filter(e=>e[key]!==undefined).slice().sort(compareEntriesNewest);
  if(!arr.length)return 0;
  if(mode==='monthly'){
    const meaningful=arr.find(e=>(Number(e[key])||0)!==0);
    if(meaningful)return meaningful[key];
  }
  return arr[0][key];
}
function homeLatestMonthlyEntry(n){return homeMonthEntriesByMode(n,'monthly').slice().sort((a,b)=>entrySortValue(b)-entrySortValue(a))[0]||null}
function homeFmt(v,type='count'){
  v=Number(v)||0;
  if(type==='money')return `¥${v.toLocaleString()}`;
  if(type==='hours')return `${Number.isInteger(v)?v:v.toFixed(1)}h`;
  if(type==='percent')return `${v.toFixed(1)}%`;
  if(type==='people')return `${v.toLocaleString()}人`;
  if(type==='cards')return `${v.toLocaleString()}枚`;
  if(type==='points')return `${Math.round(v).toLocaleString()}pt`;
  return `${v.toLocaleString()}件`;
}
function homeLatestMonthlyEntryForKeys(n,keys){
  const arr=homeMonthEntriesByMode(n,'monthly').filter(e=>keys.some(k=>e[k]!==undefined)).slice().sort(compareEntriesNewest);
  return arr.find(e=>keys.some(k=>(Number(e[k])||0)!==0))||arr[0]||null;
}
function homeRatioValue(n,numKey,denKey){const e=homeLatestMonthlyEntryForKeys(n,[numKey,denKey]);if(!e)return 0;const a=Number(e[numKey])||0,b=Number(e[denKey])||0;return b?a/b*100:0}
function homeCustomStats(role,mode){
  return (db.customPoints?.[role]||[]).filter(x=>x.mode===mode).map(x=>{
    if(x.calc==='ratio'){
      if(mode==='monthly'){
        const e=homeLatestMonthlyEntry(target),a=Number(e?.[`customNum_${x.id}`])||0,b=Number(e?.[`customDen_${x.id}`])||0;
        return [x.name,`${b?(a/b*100).toFixed(1):'0.0'}%`];
      }
      const a=homeSumMode(target,`customNum_${x.id}`,mode),b=homeSumMode(target,`customDen_${x.id}`,mode);
      return [x.name,`${b?(a/b*100).toFixed(1):'0.0'}%`];
    }
    const v=mode==='monthly'?homeLatestModeValue(target,`customPoint_${x.id}`,mode):homeSumMode(target,`customPoint_${x.id}`,mode);
    return [x.name,homeFmt(v,'count')];
  });
}

async function saveEntryRecordSafely(e){

  saveInProgress=true;
  try{
    // 最新状態へこの1件だけを追加して保存。競合時は最新データを取り直して再試行する。
    for(let attempt=0;attempt<4;attempt++){
      const latest=await apiCall({action:'load',token:sessionToken});
      const fresh=normalizeDB(latest.data);
      const existingIndex=(fresh.entries||[]).findIndex(x=>String(x.id)===String(e.id));
      if(existingIndex>=0)fresh.entries[existingIndex]=JSON.parse(JSON.stringify(e));
      else fresh.entries.push(JSON.parse(JSON.stringify(e)));
      try{
        const r=await apiCall({action:'save',token:sessionToken,data:fresh,revision:Number(latest.revision)||0});
        const returned=normalizeDB(r.data);
        const stored=(returned.entries||[]).find(x=>String(x.id)===String(e.id));
        if(!savedEntryMatches(e,stored)){
          console.warn('save response verification failed',e,stored);
          continue;
        }
        applyServerState(returned,r.revision);syncIdentityFromIds();return true;
      }catch(err){
        if(err.code==='conflict')continue;
        throw err;
      }
    }
    throw new Error('save_verify_retry_exceeded');
  }catch(err){
    console.error('entry save failed',err);
    if(err.message!=="ログインし直してください")alert('送信できませんでした。入力内容は画面に残しています。通信状態を確認して、もう一度「この内容を送信」を押してください。');

  }finally{saveInProgress=false}
}

function rankingTabsForRole(role,mode=rankMode){return mode==='monthly'?monthlyRankingTabsForRole(role):dailyRankingTabsForRole(role)}
function rankUnit(role,key,mode=rankMode){
  if(['plus','unitPrice','techSales','retailSales'].includes(key))return '円';
  if(['lesson','preStaffLesson','supervision','lessonRecordDaily','lessonMonth'].includes(key))return 'h';
  if(['__nextRatio','__retailRatio','minimoRepeat'].includes(key))return '%';
  if(key==='assistantNominationPoints'||key==='entryPoints')return 'pt';
  if(['referral','referralMonth'].includes(key))return '枚';
  if(['newGuests','newGuestsDaily','selfAttractMonth','selfAttractDaily','assistantGuest','nextBenefitVisitors'].includes(key))return '人';
  if(['newNext','newNextDaily'].includes(key))return '件';
  if(['reviewDaily','reviewCount'].includes(key))return 'ポイント';
  return '';
}
function formatRankValue(role,key,v,mode=rankMode){
  const unit=rankUnit(role,key,mode);
  if(unit==='円')return `¥${Math.round(v).toLocaleString()}`;
  if(['assistantAttendance1','assistantAttendance6','jrAttendance','attendance','eyelashBenefit','nailBenefit','holidayBenefit'].includes(key))return Number(v)>0?'達成':'未達成';
  const n=Number.isInteger(v)?v.toLocaleString():v.toLocaleString(undefined,{maximumFractionDigits:1});
  return `${n}${unit}`;
}
function rankingRoleForMonth(m,month){
  if(!m)return 'assistant';
  const monthRows=db.entries.filter(e=>{
    const sameMember=(e.memberId&&e.memberId===m.id)||(!e.memberId&&e.name===m.name);
    return sameMember&&e.mode!=='badgeSelection'&&monthKey(e.date)===month;
  }).slice().sort(compareEntriesNewest);
  // その月に保存済みの役職がある場合は、現在役職や移行済みroleHistoryより実データを優先する。
  const withSavedRole=monthRows.find(e=>e&&e.job);
  if(withSavedRole?.job)return withSavedRole.job;
  return roleForMonth(m,month);
}
function memberHasRoleDataInMonth(m,role,month){
  return db.entries.some(e=>{
    const sameMember=(e.memberId&&e.memberId===m.id)||(!e.memberId&&e.name===m.name);
    if(!sameMember||e.mode==='badgeSelection'||monthKey(e.date)!==month)return false;
    return (e.job||roleForDate(m,e.date))===role;
  });
}
function memberEligibleForRanking(m,role,month){
  if(!m||m.active===false||m.deleted===true)return false;
  // その月に実際にその役職で保存した履歴が1件でもあれば必ず対象。
  // 保存履歴がない人だけ役職履歴で補完する。
  if(memberHasRoleDataInMonth(m,role,month))return true;
  const hasAnyRoleData=db.entries.some(e=>{
    const sameMember=(e.memberId&&e.memberId===m.id)||(!e.memberId&&e.name===m.name);
    return sameMember&&e.mode!=='badgeSelection'&&monthKey(e.date)===month&&!!e.job;
  });
  return !hasAnyRoleData&&roleForMonth(m,month)===role;
}
function topRanks(role,key,month=currentMonth(),mode=rankMode){
  return db.members
    .filter(m=>memberEligibleForRanking(m,role,month))
    .map(m=>({memberId:m.id,name:m.name,v:mode==='monthly'?monthlyRankValue(m,key,month,role):dailyRankValue(m,key,month,role)}))
    .sort((a,b)=>b.v-a.v||String(a.name).localeCompare(String(b.name),'ja'))
    .slice(0,3)
}
const RANK_MOTION_STORE='francesca_rank_motion_v51';
function rankMotionKey(role,key,month,mode){return `${role}|${mode}|${month}|${key}`}
function rankMotionFor(rows,role,key,month,mode){
  let all={};try{all=JSON.parse(localStorage.getItem(RANK_MOTION_STORE)||'{}')||{}}catch(e){}
  const k=rankMotionKey(role,key,month,mode), names=rows.map(r=>r.name), prev=all[k];
  let previous,current;
  if(!prev){previous=names.slice();current=names.slice();}
  else if(Number(prev.revision)!==Number(revision)){previous=Array.isArray(prev.current)?prev.current.slice():names.slice();current=names.slice();}
  else{previous=Array.isArray(prev.previous)?prev.previous.slice():names.slice();current=Array.isArray(prev.current)?prev.current.slice():names.slice();}
  all[k]={revision:Number(revision)||0,previous,current};
  try{localStorage.setItem(RANK_MOTION_STORE,JSON.stringify(all))}catch(e){}
  return rows.map((r,i)=>{const p=previous.indexOf(r.name);if(p<0)return 'up';if(i<p)return 'up';if(i>p)return 'down';return 'same'})
}
function rankMotionHTML(motion){
  if(motion==='up')return '<span class="rank-motion up" title="順位アップ">↑</span>';
  if(motion==='down')return '<span class="rank-motion down" title="順位ダウン">↓</span>';
  return '<span class="rank-motion same" title="順位変化なし">→</span>';
}

dgesHTML(m,42)}<span>${esc(r.name)}</span></div><div class="rank-val">${formatRankValue(rankRole,rankKey,r.v,rankMode)}</div></div>`}).join(''):`<div class="rank-empty">この役職のメンバーはまだいません。</div>`}</div>${rankingPhotosHTML(rankingPhotoMonth)}`;

  try{const r=await apiCall({action:'change_pin',token:sessionToken,oldPin:a,newPin:b});sessionToken=r.token;localStorage.setItem(TOKEN_STORE,sessionToken);oldPin.value='';newPin.value='';alert('PINを変更しました。前のPINと、他端末の古いログイン状態は無効になりました。')}
  catch(e){alert(e.code==='wrong_old_pin'?'現在のPINが違います':'PIN変更に失敗しました')}
}

async function saveRuleEdit(role,button){

  if(button){button.disabled=true;button.textContent='保存中…'}

  freezeUnsnapshottedEntries();

.name)}</b><div class="head-sub">${roleJP(x.job)}｜未付与総額 ${Math.round(totalPoints(x.name)).toLocaleString()}pt</div></div></div><div style="text-align:right"><b>${esc(monthLabel(grantMonth))} ${earned.toLocaleString()}pt</b><div class="head-sub" style="margin-top:2px">${done?'付与済み':`この月の未付与 ${ungranted.toLocaleString()}pt`}</div><button class="secondary small" style="display:block;margin-top:6px;margin-left:auto" onclick="markPointsGranted('${x.id}','${grantMonth}',this)" ${earned<=0||ungranted<=0?'disabled':''}>${done?'付与済み':'付与済みにする'}</button></div></div>`}).join('')}</div></details><details class="card admin-accordion" id="adminManualGrant"><summary>手動ポイント付与<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice" style="margin-bottom:10px">申請できなかった場合などに、親機からポイントを追加できます。付与内容は本人の履歴に「親機手動付与」として残ります。</div><div class="label">付与するスタッフ</div><select id="manualGrantMember"><option value="">スタッフを選択</option>${activeMembers.map(x=>`<option value="${esc(x.id)}">${esc(x.name)}｜${roleJP(x.job)}</option>`).join('')}</select><div class="label">対象日</div><input id="manualGrantDate" type="date" value="${localDateString()}"><div class="label">何のポイント？</div><input id="manualGrantLabel" placeholder="例：クチコミポイント"><div class="label">追加ポイント</div><input id="manualGrantPoints" type="number" inputmode="numeric" min="1" step="1" placeholder="例：100"><div class="label">メモ（任意）</div><textarea id="manualGrantMemo" placeholder="例：月末入力が保存できなかったため親機で追加"></textarea><button id="manualGrantBtn" style="width:100%;margin-top:10px" onclick="adminManualGrantPoints()">手動でポイントを付与</button></div></details><details class="card admin-accordion" id="adminMonthlyPhotos"><summary>月末写真<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">月末に掲載したい写真を親機から貼れます。保存した写真は全員のランキングページに表示されます。</div><div class="label">対象月</div><div style="display:grid;grid-template-columns:72px 1fr 72px;gap:8px;align-items:center"><button class="secondary small" onclick="adminPhotoMonthValue=shiftMonth(document.getElementById('adminPhotoMonth').value,-1);showMyPage();setTimeout(()=>openAdminAccordion('adminMonthlyPhotos'),30)">← 前へ</button><div style="text-align:center;font-weight:800">${esc(monthLabel(photoMonth))}</div><button class="secondary small" onclick="adminPhotoMonthValue=shiftMonth(document.getElementById('adminPhotoMonth').value,1);showMyPage();setTimeout(()=>openAdminAccordion('adminMonthlyPhotos'),30)">次へ →</button></div><input id="adminPhotoMonth" type="month" value="${photoMonth}" onchange="adminPhotoMonthValue=this.value;showMonthlyPhotoMonth(this.value)" style="margin-top:8px"><div class="label">写真を追加</div><input type="file" accept="image/*" onchange="addMonthlyPhoto(this)"><div id="monthlyPhotoArea">${photos.length?`<div class="month-photo-grid">${photos.map(p=>`<div class="month-photo"><img src="${p.image}" alt="月末写真"><div class="meta">${esc(p.month)}｜${esc(p.uploadedBy||'親機')}<button class="ghost small" style="width:100%;margin-top:6px;border-color:#d8b8b3;color:#9a4f48" onclick="deleteMonthlyPhoto(${p.id})">写真を削除</button></div></div>`).join('')}</div>`:'<div class="head-sub" style="margin-top:10px">この月の写真はまだありません。</div>'}</div></div></details><details class="card admin-accordion" id="adminMembers"><summary>スタッフ一覧・管理<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">固定ユーザーIDで管理します。名前を変更しても同じ本人として履歴・ランキング・ログイン情報を引き継ぎます。追加したメンバーはログイン画面に自動反映されます。</div><div class="label">表示名</div><input id="newMemberName" placeholder="例：佐藤"><div class="label">初期PIN</div><input id="newMemberPin" inputmode="numeric" maxlength="4" placeholder="0000"><div class="label">役職</div><select id="newMemberRole"><option value="assistant">アシスタント</option><option value="jr">Jr.スタイリスト</option><option value="stylist">スタイリスト</option><option value="premium">プレミアムスタイリスト</option><option value="royal">ロイヤルスタイリスト</option></select><button style="width:100%;margin-top:10px" onclick="addMember()">スタッフを追加</button>${allMembers.map(x=>`<div class="field" style="margin-top:10px"><div class="setting-row"><div style="display:flex;align-items:center;gap:9px">${avatarHTML(x,38)}<div><b>${esc(x.name)}</b><div class="head-sub">ID: ${esc(String(x.id||''))}<br>${x.device==='parent'?'親機':'子機'}｜${x.active===false?'ログイン停止中':'利用中'}</div></div></div><button class="secondary small" onclick="requestDeviceChange('${x.name}')">権限変更</button></div><select onchange="changeJob('${x.name}',this.value)"><option value="assistant" ${x.job==='assistant'?'selected':''}>アシスタント</option><option value="jr" ${x.job==='jr'?'selected':''}>Jr.スタイリスト</option><option value="stylist" ${x.job==='stylist'?'selected':''}>スタイリスト</option><option value="premium" ${x.job==='premium'?'selected':''}>プレミアムスタイリスト</option><option value="royal" ${x.job==='royal'?'selected':''}>ロイヤルスタイリスト</option></select><div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap"><button class="secondary small" onclick="renameMember('${x.id}')">名前変更</button><button class="secondary small" onclick="resetPin('${x.name}')">PIN初期化</button><button class="ghost small" onclick="toggleActive('${x.name}')">${x.active===false?'ログイン再開':'ログイン停止'}</button>${x.id!==userId?`<button class="ghost small" onclick="deleteMember('${x.id}')">メンバー削除</button>`:''}</div></div>`).join('')}</div></details><details class="card admin-accordion" id="adminHistoryList"><summary>全員のポイント履歴<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">確認したいスタッフを選ぶと、申請内容を項目ごとに確認・削除できます。</div>${activeMembers.map(x=>`<button class="secondary" style="width:100%;margin-top:6px" onclick="openAdminHistory('${x.id}')">${esc(x.name)}の履歴を見る</button>`).join('')}</div></details><details class="card admin-accordion" id="adminRules"><summary>ポイントルール設定<span class="accordion-arrow">⌄</span></summary><div class="admin-accordion-body"><div class="notice">役職ごとに変更できます。保存済みの過去データは再計算されません。</div><div id="ruleEditorRoot">${ruleEditor()}</div></div></details>${manualBadgeAdminHTML()}`}page.innerHTML=`<div class="card"><div class="section-title">マイページ</div><div style="display:flex;align-items:center;gap:12px">${avatarWithBadgesHTML(m,64)}<div><b style="font-size:21px">${esc(m.name)}</b><div class="head-sub">${roleJP(m.job)}｜${m.device==='parent'?'親機（管理者）':'子機'}</div></div></div><button class="secondary" style="width:100%;margin-top:12px" onclick="renameMyName()">表示名を変更</button><div class="label">自分のアイコン</div><input type="file" accept="image/*" onchange="setMyIcon(this)">${m.icon?'<button class="ghost small" style="margin-top:6px" onclick="clearMyIcon()">アイコンを削除</button>':''}<div class="label">現在のPIN</div><input id="oldPin" type="password" inputmode="numeric" maxlength="4"><div class="label">新しい4桁PIN</div><input id="newPin" type="password" inputmode="numeric" maxlength="4"><button class="secondary" style="width:100%;margin-top:8px" onclick="changeMyPin()">パスワードを変更</button><button class="ghost" style="width:100%;margin-top:8px" onclick="logout()">ログアウト</button></div>${badgeCollectionHTML(m)}${badgeHistoryHTML(m)}${myMonthlyPointsHistoryHTML(m.name)}${admin}`}
function showMonthlyPhotoMonth(month){window.adminPhotoMonthValue=month;const area=document.getElementById('monthlyPhotoArea');if(!area)return;const photos=monthPhotoList(month);area.innerHTML=photos.length?`<div class="month-photo-grid">${photos.map(p=>`<div class="month-photo"><img src="${p.image}" alt="月末写真"><div class="meta">${esc(p.month)}｜${esc(p.uploadedBy||'親機')}<button class="ghost small" style="width:100%;margin-top:6px;border-color:#d8b8b3;color:#9a4f48" onclick="deleteMonthlyPhoto(${p.id})">写真を削除</button></div></div>`).join('')}</div>`:'<div class="head-sub" style="margin-top:10px">この月の写真はまだありません。</div>'}
</script>

</body>
</html>
